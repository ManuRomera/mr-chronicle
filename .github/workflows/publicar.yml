name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Comprobar que la etiqueta coincide con module.json
        run: test "v$(node -p "require('./module.json').version")" = "$GITHUB_REF_NAME"
      - run: sudo apt-get install -y ffmpeg && npm test
      - name: Empaquetar
        run: |
          mkdir -p dist
          zip -r dist/mr-chronicle.zip module.json mr-chronicle.mjs module workers templates styles docs prompts herramientas LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md -x 'herramientas/post/test/*' 'docs/imagenes/*'
          cp module.json dist/module.json
          npm run -s herramientas
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{p=1;next} /^## /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md || echo "Versión $version." > dist/notas.md
          printf '> **En desarrollo (WIP).** Úsalo para pruebas.\n\n**Manifiesto:** `https://github.com/ManuRomera/mr-chronicle/releases/latest/download/module.json`\n\n' | cat - dist/notas.md > dist/n && mv dist/n dist/notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mr-chronicle.zip dist/module.json dist/MR-Chronicle-herramientas.zip --title "MR · Chronicle $GITHUB_REF_NAME (WIP)" --notes-file dist/notas.md
